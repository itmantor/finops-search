<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جستجوی شناسه کالا و خدمت</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',Tahoma,sans-serif; }
  body { background:#0D1117; color:#E6EDF3; padding:20px; line-height:1.8; }
  .wrap { max-width:920px; margin:0 auto; }
  .header { text-align:center; margin-bottom:20px; }
  .header h1 { font-size:24px; font-weight:700; color:#00C896; margin-bottom:4px; }
  .header p { font-size:13px; color:#8B949E; }
  .card { background:#161B22; border:1px solid #30363D; border-radius:14px; padding:18px; margin-bottom:14px; }
  .search-box { display:flex; gap:10px; margin-bottom:12px; }
  .input { width:100%; background:#0D1117; border:1px solid #30363D; border-radius:10px; padding:10px 14px; color:#E6EDF3; font-size:15px; outline:none; }
  .input:focus { border-color:#00C896; }
  .btn { background:#00C896; color:#000; border:none; border-radius:10px; padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:#00A37A; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .mode-tabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tab { background:#0D1117; border:1px solid #30363D; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; transition:.15s; }
  .tab:hover { border-color:#00C896; }
  .tab.active { background:rgba(0,200,150,.15); border-color:#00C896; color:#00C896; font-weight:700; }
  .tab.disabled { opacity:.4; cursor:not-allowed; }
  .mode-hint { font-size:12px; color:#8B949E; margin-bottom:12px; }
  .stats { font-size:13px; color:#8B949E; margin:14px 0 10px; }
  .result { background:#161B22; border:1px solid #30363D; border-radius:10px; padding:14px 16px; margin-bottom:10px; transition:.15s; }
  .result:hover { border-color:#00C896; }
  .result-desc { font-size:14px; color:#E6EDF3; margin-bottom:10px; }
  .result-ids { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .id-group { flex:1; min-width:220px; background:#0D1117; border:1px solid #30363D; border-radius:8px; padding:8px 10px; }
  .id-label { font-size:11px; color:#8B949E; margin-bottom:6px; }
  .id-chip { display:flex; align-items:center; justify-content:space-between; gap:8px; direction:ltr; font-size:14px; font-weight:700; color:#00C896; padding:3px 0; }
  .id-chip .id-copy { font-size:12px; color:#58A6FF; cursor:pointer; direction:rtl; white-space:nowrap; }
  .id-empty { font-size:12px; color:#8B949E; }
  .result-footer { display:flex; justify-content:flex-end; }
  .result-score { font-size:11px; padding:3px 9px; border-radius:6px; background:rgba(0,200,150,.1); color:#00C896; }
  .empty { text-align:center; padding:28px; color:#8B949E; font-size:14px; }
  .status-bar { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#8B949E; }
  .status-item { display:flex; align-items:center; gap:5px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#F85149; }
  .dot.ok { background:#00C896; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #30363D; border-top-color:#00C896; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ambiguity { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .ambiguity-q { font-size:13px; color:#8B949E; }
  .chip { background:#0D1117; border:1px solid #30363D; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s; color:#E6EDF3; }
  .chip:hover { border-color:#00C896; }
  .chip.active { background:rgba(0,200,150,.15); border-color:#00C896; color:#00C896; font-weight:700; }
  .more-btn { display:block; width:100%; background:#161B22; border:1px dashed #30363D; border-radius:10px; padding:10px; text-align:center; font-size:13px; color:#8B949E; cursor:pointer; margin-top:6px; }
  .more-btn:hover { border-color:#00C896; color:#00C896; }
  .bulk-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .bulk-title { font-size:15px; font-weight:700; color:#E6EDF3; }
  .link-btn { background:none; border:1px solid #30363D; border-radius:8px; padding:7px 14px; font-size:12px; color:#58A6FF; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .link-btn:hover { border-color:#58A6FF; }
  .bulk-drop { border:1.5px dashed #30363D; border-radius:10px; padding:20px; text-align:center; cursor:pointer; transition:.15s; }
  .bulk-drop:hover, .bulk-drop.drag { border-color:#00C896; background:rgba(0,200,150,.05); }
  .bulk-drop input { display:none; }
  .bulk-drop-text { font-size:13px; color:#8B949E; }
  .bulk-file-name { font-size:13px; color:#00C896; margin-top:8px; }
  .bulk-modes { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  .bulk-mode-card { flex:1; min-width:200px; border:1.5px solid #30363D; border-radius:10px; padding:12px 14px; cursor:pointer; transition:.15s; }
  .bulk-mode-card:hover { border-color:#00C896; }
  .bulk-mode-card.selected { border-color:#00C896; background:rgba(0,200,150,.08); }
  .bulk-mode-title { font-size:13px; font-weight:700; color:#E6EDF3; margin-bottom:4px; }
  .bulk-mode-cost { font-size:12px; color:#8B949E; }
  .bulk-error { background:rgba(248,81,73,.1); border:1px solid #F85149; color:#F85149; border-radius:8px; padding:10px 14px; font-size:13px; margin-top:12px; }
  .bulk-progress-wrap { background:#0D1117; border:1px solid #30363D; border-radius:999px; height:10px; overflow:hidden; margin:12px 0 8px; }
  .bulk-progress-bar { background:#00C896; height:100%; width:0%; transition:width .3s; }
  .bulk-progress-text { font-size:12px; color:#8B949E; text-align:center; }
  .bulk-done-text { font-size:13px; color:#00C896; margin-bottom:10px; }
  .version-box { position:fixed; bottom:10px; left:10px; font-size:11px; color:#6E7681; background:rgba(22,27,34,.7); border:1px solid #30363D; border-radius:6px; padding:4px 9px; pointer-events:none; z-index:10; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>جستجوی شناسه کالا و خدمت</h1>
    <p>شرح کالا را بنویسید و شناسه‌ی تولید داخل / وارداتی آن را پیدا کنید</p>
  </div>

  <div class="card">
    <div class="status-bar" id="statusBar">
      <div class="status-item"><span class="dot" id="dotFile"></span><span id="statFile">در حال بررسی...</span></div>
      <div class="status-item"><span class="dot" id="dotKey"></span><span id="statKey">در حال بررسی...</span></div>
    </div>
  </div>

  <div class="card">
    <div class="mode-tabs">
      <div class="tab active" id="tabFast" onclick="setMode('fast')">جستجوی سریع</div>
      <div class="tab" id="tabSmart" onclick="setMode('smart')">جستجوی هوشمند</div>
    </div>
    <div class="mode-hint" id="modeHint">جستجوی متنی فوری و رایگان، بدون نیاز به اتصال خارجی.</div>
    <div class="search-box">
      <input class="input" id="q" placeholder="شرح کالا را بنویسید... مثلاً: تیرچه بلوک" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn" onclick="doSearch()" id="searchBtn">جستجو</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="results"></div>

  <div class="card">
    <div class="bulk-header">
      <span class="bulk-title">جستجوی گروهی از فایل اکسل</span>
      <a class="link-btn" href="/api/bulk/template">دانلود قالب اکسل</a>
    </div>
    <div id="bulkBody"></div>
  </div>
</div>

<div class="version-box" id="versionBox"></div>

<script>
let mode = 'fast';
let hasSmart = false;

const DISPLAY_STEP = 20;

// وضعیت آخرین جستجو، برای فیلتر کردن چیپ‌ها و «نمایش بیشتر» کاملاً سمت
// کلاینت — هرگز /api/search دوباره صدا زده نمی‌شود، چون فهم پرس‌وجو و
// Embedding هزینه دارند و پاسخ از قبل در دست است.
let lastAll = [];      // همه‌ی نتایج بازیابی‌شده (تا ۲۰۰ مورد)
let lastGroups = [];   // چیپ‌های ابهام (از سرور)
let activeLevel1 = null; // null یعنی «همه»
let shownCount = DISPLAY_STEP;

const MODE_HINTS = {
  fast: 'جستجوی متنی فوری و رایگان، بدون نیاز به اتصال خارجی.',
  smart: 'فهم هوشمند پرس‌وجو و جستجوی ترکیبی؛ چند ثانیه طول می‌کشد.',
};

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    hasSmart = !!s.has_smart;
    setDot('dotFile', 'statFile', s.record_count > 0,
      s.record_count > 0 ? s.record_count.toLocaleString('fa') + ' رکورد آماده جستجو' : 'کاتالوگ بارگذاری نشده است');
    setDot('dotKey', 'statKey', hasSmart,
      hasSmart ? 'جستجوی هوشمند در دسترس است' : 'جستجوی هوشمند در دسترس نیست (کلید OpenAI یا ایندکس معنایی تنظیم نشده)');
    document.getElementById('tabSmart').classList.toggle('disabled', !hasSmart);
    renderVersionBox(s);
  } catch (e) {
    document.getElementById('statFile').textContent = 'خطا در ارتباط با سرور';
  }
}

const PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toPersianDigits(s) {
  return String(s).replace(/[0-9]/g, d => PERSIAN_DIGITS[d]);
}

function renderVersionBox(s) {
  const box = document.getElementById('versionBox');
  const version = s.version ? toPersianDigits(s.version) : '؟';
  const commit = s.commit || 'نامشخص';
  const commitDate = s.commit_date
    ? new Date(s.commit_date).toLocaleDateString('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' })
    : 'نامشخص';
  const startedAt = s.started_at
    ? new Date(s.started_at).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })
    : 'نامشخص';
  box.textContent = `نسخه ${version} · کامیت ${commit} · ${commitDate} · اجرا از ${startedAt}`;
}

function setDot(dotId, statId, ok, text) {
  document.getElementById(dotId).className = 'dot' + (ok ? ' ok' : '');
  document.getElementById(statId).textContent = text;
}

function setMode(m) {
  if (m === 'smart' && !hasSmart) return;
  mode = m;
  document.getElementById('tabFast').classList.toggle('active', m === 'fast');
  document.getElementById('tabSmart').classList.toggle('active', m === 'smart');
  document.getElementById('modeHint').textContent = MODE_HINTS[m];
}

function idGroup(label, ids) {
  const rows = (ids && ids.length)
    ? ids.map(id => `
        <div class="id-chip">
          <span>${id}</span>
          <span class="id-copy" onclick="copyId('${id}', this)">📋 کپی</span>
        </div>`).join('')
    : '<div class="id-empty">ندارد</div>';
  return `<div class="id-group"><div class="id-label">${label}</div>${rows}</div>`;
}

async function doSearch() {
  const query = document.getElementById('q').value.trim();
  const results = document.getElementById('results');
  const stats = document.getElementById('stats');
  if (!query) { results.innerHTML = ''; stats.textContent = ''; lastAll = []; lastGroups = []; return; }

  stats.innerHTML = '<span class="spinner"></span> در حال جستجو...';
  results.innerHTML = '';

  try {
    const r = await fetch('/api/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, mode})
    });
    const res = await r.json();
    if (res.error) { stats.textContent = ''; results.innerHTML = '<div class="empty">' + res.error + '</div>'; lastAll = []; lastGroups = []; return; }

    lastAll = res.results || [];
    lastGroups = res.ambiguous ? (res.groups || []) : [];
    activeLevel1 = null;
    shownCount = DISPLAY_STEP;
    render();
  } catch (e) {
    stats.textContent = ''; results.innerHTML = '<div class="empty">خطا: ' + e + '</div>';
  }
}

function currentFiltered() {
  return activeLevel1 === null ? lastAll : lastAll.filter(r => r.level1 === activeLevel1);
}

function render() {
  const results = document.getElementById('results');
  const stats = document.getElementById('stats');

  if (lastAll.length === 0) {
    stats.textContent = '';
    results.innerHTML = '<div class="empty">نتیجه‌ای پیدا نشد.</div>';
    return;
  }

  const filtered = currentFiltered();
  const visible = filtered.slice(0, shownCount);
  stats.textContent = filtered.length + ' نتیجه';

  let html = '';
  if (lastGroups.length > 0) {
    html += '<div class="ambiguity"><span class="ambiguity-q">منظورتان کدام است؟</span>';
    for (const g of lastGroups) {
      html += `<span class="chip${activeLevel1 === g.level1 ? ' active' : ''}" onclick="selectChip('${g.level1.replace(/'/g, "\\'")}')">${g.label}</span>`;
    }
    html += `<span class="chip${activeLevel1 === null ? ' active' : ''}" onclick="selectChip(null)">همه</span>`;
    html += '</div>';
  }

  html += visible.map(r => `
    <div class="result">
      <div class="result-desc">${r.description}</div>
      <div class="result-ids">
        ${idGroup('شناسه تولید داخل', r.domestic_ids)}
        ${idGroup('شناسه وارداتی', r.imported_ids)}
      </div>
      <div class="result-footer">
        <span class="result-score">تطابق ${r.score}٪</span>
      </div>
    </div>
  `).join('');

  if (filtered.length > shownCount) {
    html += `<div class="more-btn" onclick="showMore()">نمایش بیشتر (${filtered.length - shownCount} مورد دیگر)</div>`;
  }

  results.innerHTML = html;
}

function selectChip(level1) {
  activeLevel1 = level1;
  shownCount = DISPLAY_STEP;
  render();
}

function showMore() {
  shownCount += DISPLAY_STEP;
  render();
}

function copyId(id, el) {
  navigator.clipboard.writeText(id);
  const original = el.textContent;
  el.textContent = '✓ کپی شد';
  setTimeout(() => el.textContent = original, 1500);
}

// ------------------------------------------------------------ جستجوی گروهی

const BULK_JOB_KEY = 'bulkJobId';
let bulkPollTimer = null;
let bulkStagedMode = 'smart';

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function bulkRenderIdle(errorMsg) {
  clearInterval(bulkPollTimer);
  localStorage.removeItem(BULK_JOB_KEY);
  document.getElementById('bulkBody').innerHTML = `
    <label class="bulk-drop" id="bulkDrop">
      <input type="file" id="bulkFile" accept=".xlsx,.csv" onchange="bulkOnFilePicked(this.files[0])">
      <div class="bulk-drop-text">یک فایل xlsx یا csv را اینجا انتخاب کنید (حداکثر ۱۰۰۱ ردیف)</div>
      <div class="bulk-file-name" id="bulkFileName"></div>
    </label>
    ${errorMsg ? `<div class="bulk-error">${escapeHtml(errorMsg)}</div>` : ''}
  `;
}

async function bulkOnFilePicked(file) {
  if (!file) return;
  document.getElementById('bulkFileName').textContent = 'در حال بررسی «' + file.name + '»...';

  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/bulk/prepare', { method: 'POST', body: fd });
    const res = await r.json();
    if (res.error) { bulkRenderIdle(res.error); return; }
    localStorage.setItem(BULK_JOB_KEY, res.job_id);
    bulkRenderStaged(res.job_id, file.name, res.row_count);
  } catch (e) {
    bulkRenderIdle('خطا در آپلود: ' + e);
  }
}

const LARGE_FILE_THRESHOLD = 200;   // بالاتر از این، انتخاب حالت اجباری می‌شود (نه پیش‌فرض)
const ASSUMED_DAILY_QUOTA = 10000;  // فقط برای تخمین درصد مصرف سهمیه در هشدار؛ سهمیه‌ی واقعی می‌تواند فرق کند

function bulkRenderStaged(jobId, filename, rowCount) {
  const isLarge = rowCount > LARGE_FILE_THRESHOLD;
  bulkStagedMode = isLarge ? null : 'smart';  // برای فایل بزرگ، هیچ حالتی پیش‌فرض انتخاب نمی‌شود — انتخاب باید آگاهانه باشد

  const smartCalls = rowCount * 2;
  const quotaPct = Math.round((smartCalls / ASSUMED_DAILY_QUOTA) * 100);
  const warning = isLarge ? `
    <div class="bulk-error" style="background:rgba(240,180,40,.1);border-color:#F0B428;color:#F0B428;">
      این فایل ${rowCount.toLocaleString('fa')} ردیف دارد. حالت «هوشمند» یعنی
      ${smartCalls.toLocaleString('fa')} فراخوانی API (~${quotaPct.toLocaleString('fa')}٪ از یک سهمیه‌ی روزانه‌ی معمول ۱۰٬۰۰۰تایی
      در یک آپلود). لطفاً حالت را آگاهانه انتخاب کنید.
    </div>` : '';

  document.getElementById('bulkBody').innerHTML = `
    <div class="bulk-file-name">📄 ${escapeHtml(filename)} — ${rowCount.toLocaleString('fa')} ردیف</div>
    ${warning}
    <div class="bulk-modes">
      <div class="bulk-mode-card${bulkStagedMode === 'fast' ? ' selected' : ''}" id="bulkModeFast" onclick="bulkSelectMode('fast')">
        <div class="bulk-mode-title">سریع</div>
        <div class="bulk-mode-cost">رایگان، بدون فراخوانی API — برای یک بررسی اولیه</div>
      </div>
      <div class="bulk-mode-card${bulkStagedMode === 'smart' ? ' selected' : ''}" id="bulkModeSmart" onclick="bulkSelectMode('smart')">
        <div class="bulk-mode-title">هوشمند</div>
        <div class="bulk-mode-cost">${rowCount.toLocaleString('fa')} سطر × ۲ فراخوانی = ${smartCalls.toLocaleString('fa')} فراخوانی API</div>
      </div>
    </div>
    <div class="search-box">
      <button class="btn" onclick="bulkStart('${jobId}')" id="bulkStartBtn" ${bulkStagedMode ? '' : 'disabled'}>شروع پردازش</button>
      <button class="link-btn" onclick="bulkRenderIdle()">انصراف</button>
    </div>
  `;
}

function bulkSelectMode(m) {
  bulkStagedMode = m;
  document.getElementById('bulkModeFast').classList.toggle('selected', m === 'fast');
  document.getElementById('bulkModeSmart').classList.toggle('selected', m === 'smart');
  const startBtn = document.getElementById('bulkStartBtn');
  if (startBtn) startBtn.disabled = false;
}

async function bulkStart(jobId) {
  if (!bulkStagedMode) return;  // دفاعی؛ دکمه تا انتخاب حالت غیرفعال است
  try {
    const r = await fetch('/api/bulk/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ job_id: jobId, mode: bulkStagedMode }),
    });
    const res = await r.json();
    if (res.error) { bulkRenderIdle(res.error); return; }
    bulkRenderProcessing(jobId);
  } catch (e) {
    bulkRenderIdle('خطا در شروع پردازش: ' + e);
  }
}

function bulkRenderProcessing(jobId) {
  document.getElementById('bulkBody').innerHTML = `
    <div class="bulk-progress-text" id="bulkProgressText">در حال آماده‌سازی...</div>
    <div class="bulk-progress-wrap"><div class="bulk-progress-bar" id="bulkProgressBar"></div></div>
    <div class="bulk-progress-text">می‌توانید این صفحه را ببندید؛ با بازگشت به همین آدرس، پیشرفت ادامه پیدا می‌کند.</div>
  `;
  clearInterval(bulkPollTimer);
  bulkPollJob(jobId);
  bulkPollTimer = setInterval(() => bulkPollJob(jobId), 2000);
}

async function bulkPollJob(jobId) {
  try {
    const r = await fetch('/api/bulk/status/' + jobId);
    if (r.status === 404) { bulkRenderIdle('این فایل دیگر روی سرور موجود نیست (شاید منقضی شده)؛ لطفاً دوباره آپلود کنید.'); return; }
    const s = await r.json();

    if (s.status === 'error') {
      clearInterval(bulkPollTimer);
      bulkRenderIdle('خطا در پردازش: ' + (s.error || ''));
      return;
    }
    if (s.status === 'done') {
      clearInterval(bulkPollTimer);
      bulkRenderDone(jobId, s);
      return;
    }

    const total = s.row_count || 1;
    const processed = s.processed || 0;
    const pct = Math.min(100, Math.round(100 * processed / total));
    const bar = document.getElementById('bulkProgressBar');
    const text = document.getElementById('bulkProgressText');
    if (bar) bar.style.width = pct + '%';
    if (text) text.textContent = `${processed.toLocaleString('fa')} از ${total.toLocaleString('fa')} ردیف پردازش شد`;
  } catch (e) {
    // خطای موقت شبکه؛ در tick بعدی دوباره تلاش می‌شود، وضعیت فعلی حفظ می‌شود.
  }
}

function bulkRenderDone(jobId, s) {
  const quotaStopped = s.stopped_reason === 'quota_exhausted';
  const message = quotaStopped
    ? `<div class="bulk-error" style="background:rgba(240,180,40,.1);border-color:#F0B428;color:#F0B428;">
         سهمیه‌ی روزانه‌ی API تمام شد — ${(s.processed || 0).toLocaleString('fa')} از ${(s.row_count || 0).toLocaleString('fa')}
         ردیف پردازش شد. نتیجه‌ی همین بخش را دانلود کنید؛ برای ادامه، همین فایل نتیجه را بعد از تمدید سهمیه دوباره
         آپلود کنید — ردیف‌های تمام‌شده تکرار نمی‌شوند.
       </div>`
    : `<div class="bulk-done-text">✓ پردازش «${escapeHtml(s.original_filename || '')}» کامل شد.</div>`;
  document.getElementById('bulkBody').innerHTML = `
    ${message}
    <div class="search-box">
      <a class="btn" style="text-decoration:none;display:inline-block" href="/api/bulk/result/${jobId}">دانلود نتیجه</a>
      <button class="link-btn" onclick="bulkRenderIdle()">آپلود فایل جدید</button>
    </div>
  `;
}

function bulkResume() {
  const jobId = localStorage.getItem(BULK_JOB_KEY);
  if (!jobId) { bulkRenderIdle(); return; }

  fetch('/api/bulk/status/' + jobId).then(async r => {
    if (r.status === 404) { bulkRenderIdle(); return; }
    const s = await r.json();
    if (s.status === 'staged') {
      bulkRenderStaged(jobId, s.original_filename, s.row_count);
    } else if (s.status === 'done') {
      bulkRenderDone(jobId, s);
    } else if (s.status === 'error') {
      bulkRenderIdle('خطا در پردازش: ' + (s.error || ''));
    } else {
      bulkRenderProcessing(jobId);
    }
  }).catch(() => bulkRenderIdle());
}

refreshStatus();
bulkResume();
</script>
